# Builds the Freqazoid APK (one APK for both the phone and the Galaxy Watch6) on GitHub's servers.
# Runs on every push, or manually: Actions tab -> "Build APK" -> "Run workflow".
# Download: open the finished run -> Artifacts -> "freqazoid-apk".
name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Check required project files
        run: |
          missing=0
          if ! ls app/src/main/res/drawable*/app_icon.* >/dev/null 2>&1 && ! ls app/src/main/res/mipmap*/app_icon.* >/dev/null 2>&1; then
            echo "::error::Missing the logo (app/src/main/res/drawable/app_icon.*). Copy the 0.6.0 source over your v0.5.0 project so its res/ folder is included."
            missing=1
          fi
          if [ ! -f debug-signing/freakazoid-debug.jks ]; then
            echo "::warning::debug-signing/freakazoid-debug.jks not found. Creating a NEW key: this APK will not install over your current Freqazoid until you uninstall the old one."
            mkdir -p debug-signing
            keytool -genkeypair -keystore debug-signing/freakazoid-debug.jks -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Freqazoid Debug"
          fi
          exit $missing

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # GitHub's Ubuntu runners ship the Android SDK; use its own sdkmanager.
      - name: Install Android SDK 35
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: freqazoid-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Direct phone-friendly download: https://github.com/<owner>/<repo>/releases/download/latest/Freqazoid.apk
      - name: Publish APK as the "latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Freqazoid.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Freqazoid.apk --target "$GITHUB_SHA" --title "Freqazoid (latest build)" \
            --notes "Built from ${GITHUB_SHA::7}. One APK for the phone and the Galaxy Watch6. Debug-signed (development key)."
